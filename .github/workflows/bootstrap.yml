name: Bootstrap verified release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  bootstrap:
    if: github.event.head_commit.message == 'Bootstrap Traktor Performance Display repository'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install verified v0.18.23 release tree
        shell: bash
        run: |
          printf '%s' '' | base64 --decode | tar -xz
          rm -f .github/workflows/bootstrap.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Initial Traktor Performance Display v0.18.23 release"
          git push
